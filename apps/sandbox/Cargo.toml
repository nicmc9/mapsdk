[package]
name = "sandbox"
description = "Тестовое приложение: проверка запуска движка на всех платформах"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# [Rust] Один пакет собирается в двух видах:
# - lib (cdylib) — динамическая библиотека для Android (.so) и Web (.wasm);
# - bin (src/main.rs) — исполняемый файл для macOS, Linux и iOS.
# "rlib" — обычная Rust-библиотека, нужна, чтобы main.rs мог вызвать код из lib.rs.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
engine = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
