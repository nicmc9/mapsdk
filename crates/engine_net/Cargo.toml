[package]
name = "engine_net"
description = "Сетевой загрузчик: таймауты, повторы, дедупликация, дисковый кеш"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
engine_core = { workspace = true }
engine_ecs = { workspace = true }
engine_platform = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Request", "RequestInit", "Response", "Headers", "AbortSignal"] }
