[package]
name = "engine_core"
description = "Ядро движка: App, плагины, стадии кадра, время"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
engine_ecs = { workspace = true }
engine_platform = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }
triple_buffer = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
bevy_tasks = { workspace = true }

# Пулы потоков задач — только там, где есть потоки
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_tasks = { workspace = true, features = ["multi_threaded"] }

[dev-dependencies]
criterion = { workspace = true }

# Бенчмарк: `cargo bench -p engine_core`. harness = false — свой main у criterion вместо встроенного
[[bench]]
name = "sync_ecs"
harness = false
