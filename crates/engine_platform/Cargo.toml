[package]
name = "engine_platform"
description = "Окно, цикл событий ОС и жизненный цикл приложения"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
winit = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# [Rust] Зависимости только для конкретной платформы — аналог if(ANDROID) в CMake.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android_logger = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = { workspace = true }
console_error_panic_hook = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
env_logger = { workspace = true }
